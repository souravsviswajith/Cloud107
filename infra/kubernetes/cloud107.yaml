apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud107
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud107
  template:
    metadata:
      labels:
        app: cloud107
    spec:
      containers:
        - name: cloud107
          image: cloud107:1.0.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: SQL_HOST
              value: postgres
            - name: SQL_USER
              value: postgres
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloud107-secrets
                  key: SQL_PASSWORD
            - name: SQL_DB_NAME
              value: cloud107
            - name: C107_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloud107-secrets
                  key: C107_AUTH_SECRET
            - name: APP_URL
              value: http://cloud107:3000
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cloud107
spec:
  selector:
    app: cloud107
  ports:
    - name: http
      port: 3000
      targetPort: http
  type: ClusterIP
